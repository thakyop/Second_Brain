
spring.application.name=second-brain

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/secondbrain}
spring.datasource.username=${DB_USERNAME:secondbrain}
spring.datasource.password=${DB_PASSWORD:dev_password}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
document.ingestion.chunk-size=1000
document.ingestion.chunk-overlap=200

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
logging.level.org.springframework.security=TRACE


app.storage.root=${STORAGE_ROOT:./storage}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text

# Chat (phase 5). A 3B model fits next to everything else in 8 GB of memory.
spring.ai.ollama.chat.model=${CHAT_MODEL:llama3.2:3b}
# Low temperature: stick to the passages instead of being creative.
spring.ai.ollama.chat.temperature=0.2
# Ollama silently drops the start of a longer prompt, which would cut off
# the instructions. Passages + history + answer fit well within 4096 tokens.
spring.ai.ollama.chat.num-ctx=4096
# At most ~400 words per answer, which also bounds how long an answer takes.
spring.ai.ollama.chat.num-predict=512
# Spring AI calls Ollama through Boot's HTTP client, which has no read
# timeout by default; a local model is slow, but must not hang forever.
spring.http.clients.read-timeout=180s

# How many passages to give the model, and how far (cosine distance) a
# passage may be from the question to count as related. Measured with
# nomic-embed-text on sample notes and a PDF: related questions had a best
# match at 0.26-0.46, unrelated ones at 0.53 or more.
app.chat.top-k=5
app.chat.max-distance=0.5
# Also drop passages much further away than the best match.
app.chat.max-distance-from-best=0.1
# Earlier messages of the chat that are sent along, for follow-up questions.
app.chat.history-messages=6