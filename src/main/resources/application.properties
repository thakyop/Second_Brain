
spring.application.name=second-brain

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/secondbrain}
spring.datasource.username=${DB_USERNAME:secondbrain}
spring.datasource.password=${DB_PASSWORD:dev_password}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
logging.level.org.springframework.security=TRACE


app.storage.root=${STORAGE_ROOT:./storage}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB